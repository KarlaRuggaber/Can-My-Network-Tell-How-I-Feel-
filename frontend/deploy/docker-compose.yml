# Results portal v3 on the gateway mini-PC, next to v1 (tag frontend-v1, /opt/cmn-portal, port 8600)
# and v2 (/opt/cmn-portal-v2, port 8610):
#   sudo docker compose -f /opt/cmn-portal-v3/frontend/deploy/docker-compose.yml up -d --build
#
# Docker runs there with "iptables": false, so the containers use the host network. The portal
# listens on 127.0.0.1:8620 only; `tailscale serve` publishes v1, v2 or v3 inside the tailnet (HTTPS),
# see switch-gateway.sh. Day records are computed on the laptop and pushed to
# /var/lib/cmn-portal/cache (sync-gateway.sh); v1, v2 and v3 read the same records. v3 has its own
# home (logins, people, care plans, notes, assistant settings), copied from v2 on the first deploy.
# Dictation: the container cmn-whisper from v2's compose project (127.0.0.1:8601 only) is shared;
# the portal passes recordings to it after checking the login. No audio leaves the mini-PC.
# It is not defined here, because a second service with the same container name would clash.
name: cmn-portal-v3
services:
  portal:
    build:
      context: /opt/cmn-portal-v3
      dockerfile: frontend/deploy/Dockerfile
      network: host
    image: cmn-portal-v3:latest
    container_name: cmn-portal-v3
    command: ["uvicorn", "cmn_frontend.api:app", "--host", "127.0.0.1", "--port", "8620"]
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m            # the live run needs the memory; the portal stays far below this
    environment:
      CMN_DATA: /data
      CMN_PROCESSED: /data/processed_parquet
      CMN_RUN: /data/run
      CMN_CACHE: /data/cache
      CMN_HOME: /data/home
      CMN_COOKIE_SECURE: "1"   # reached only over HTTPS (tailscale serve)
      CMN_WHISPER_URL: http://127.0.0.1:8601
    volumes:
      - /opt/can-my-network/app_pcap_to_dsm5/app/processed_parquet:/data/processed_parquet:ro
      - /var/lib/traffic-executor:/data/run:ro
      - /var/lib/cmn-portal/cache:/data/cache:ro
      - /var/lib/cmn-portal-v3/home:/data/home
      - /opt/can-my-network/app_pcap_to_dsm5/app:/repo/app_pcap_to_dsm5/app:ro
      - /opt/can-my-network/traffic-runner/config/devices.csv:/repo/traffic-runner/config/devices.csv:ro
