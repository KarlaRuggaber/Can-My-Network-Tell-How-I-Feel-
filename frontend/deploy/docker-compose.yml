# Results portal on the gateway mini-PC:
#   sudo docker compose -f /opt/cmn-portal/frontend/deploy/docker-compose.yml up -d --build
#
# Docker runs there with "iptables": false, so the container uses the host network. The portal
# listens on 127.0.0.1:8600 only; `tailscale serve` publishes it inside the tailnet (HTTPS).
# Day records are computed on the laptop and pushed to /var/lib/cmn-portal/cache (sync-gateway.sh).
name: cmn-portal
services:
  portal:
    build:
      context: /opt/cmn-portal
      dockerfile: frontend/deploy/Dockerfile
      network: host
    image: cmn-portal:latest
    container_name: cmn-portal
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m            # the live run needs the memory; the portal stays far below this
    environment:
      CMN_DATA: /data
      CMN_PROCESSED: /data/processed_parquet
      CMN_RUN: /data/run
      CMN_CACHE: /data/cache
      CMN_HOME: /data/home
      CMN_COOKIE_SECURE: "1"   # reached only over HTTPS (tailscale serve)
    volumes:
      - /opt/can-my-network/app_pcap_to_dsm5/app/processed_parquet:/data/processed_parquet:ro
      - /var/lib/traffic-executor:/data/run:ro
      - /var/lib/cmn-portal/cache:/data/cache:ro
      - /var/lib/cmn-portal/home:/data/home
      - /opt/can-my-network/app_pcap_to_dsm5/app:/repo/app_pcap_to_dsm5/app:ro
      - /opt/can-my-network/traffic-runner/config/devices.csv:/repo/traffic-runner/config/devices.csv:ro
