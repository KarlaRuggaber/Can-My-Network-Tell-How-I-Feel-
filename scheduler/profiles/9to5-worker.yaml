# Machine-readable §9 of profiles/tier0-healthy/9to5-worker.md (format: scheduler/README.md §2).
# Block IDs, windows, durations and mixes are taken over 1:1; deviations are marked "scheduler:".
profile: 9to5-worker
source: profiles/tier0-healthy/9to5-worker.md
tier: 0
timezone: Europe/Zurich
window_days: 14
warmup_days: 1
start_weekday: Mon
devices: [phone, laptop]
noise: {duration: 0.15}          # "±15 % on durations": one factor U(0.85, 1.15) per day (day-to-day volume noise)

day_types:
  home_office: [Mon, Fri]
  office:      [Tue, Wed, Thu]
  weekend:     [Sat, Sun]

anchors:
  wake:
    - {day_types: [home_office, office], value: 'N("06:30", 15m)'}
    - {day_types: [weekend],             value: 'N("08:30", 45m)'}
  sleep:                         # night of day d; times before 12:00 are on d+1
    - {days: [Sun, Mon, Tue, Wed, Thu], value: 'N("23:00", 30m)'}
    - {days: [Fri, Sat],                value: 'N("00:00", 45m)'}

away:
  - {id: office_day,  day_types: [office], from: 'N("07:30", 20m)', to: 'N("18:00", 20m)',
     not_before: wake + 20m}     # scheduler: not_before keeps the wake check at home
  - {id: weekend_out, day_types: [weekend], per_week: 1, from: "14:00", to: "18:00"}
  - {id: evening_out, days: [Fri, Sat], per_week: 1, from: "20:00", to: "00:30",
     replaces: evening, sleep_after_return: 15m-30m}

blocks:
  # morning
  - {id: wake_check,     day_types: all, at: wake, device: phone, activity: phone_check, duration: 5m-15m,
     mix: {news: .4, messaging: .4, search: .2}}
  # home-office work day
  - {id: work_am,        day_types: [home_office], from: "08:00", to: "12:00", device: laptop, activity: work_block}
  - {id: work_pm,        day_types: [home_office], from: "13:00", to: "17:30", device: laptop, activity: work_block}
  - {id: work_call,      day_types: [home_office], count: 1-2, within: ["09:00", "17:00"], device: laptop,
     activity: video_call, platform: teams, duration: 30m-60m}
  - {id: day_checks,     day_types: [home_office], count: 6-10, within: ["08:00", "17:30"], device: phone,
     activity: phone_check, duration: 1m-5m, mix: {messaging: .4, news: .3, social_passive: .3}}
  - {id: lunch_checks,   day_types: [home_office], count: 2-3, within: ["12:00", "13:00"], device: phone,
     activity: phone_check, mix: {social_passive: .5, news: .5}}
  # weekend daytime
  - {id: weekend_browse, day_types: [weekend], from: wake, duration: 60m-120m, device: laptop, activity: browse,
     mix: {news: .3, shopping: .3, social_passive: .2, search: .2}}
  - {id: weekend_checks, day_types: [weekend], count: 4-8, within: ["10:00", "19:00"], device: phone,
     activity: phone_check, mix: {messaging: .4, social_passive: .4, shopping: .2}}
  # evening (cancelled on evening-out days)
  - {id: evening_stream, group: evening, day_types: [home_office, office], within: ["19:00", "22:30"], device: laptop,
     activity: video_stream, duration: 60m-120m, mix: {streaming: 1}}
  - {id: evening_checks, group: evening, day_types: all, count: 3-5, within: ["18:00", sleep], device: phone,
     activity: phone_check, mix: {social_passive: .5, messaging: .5}}
  - {id: evening_msg,    group: evening, day_types: all, count: 1-2, within: ["18:00", "22:00"], device: phone,
     activity: messaging}
  - {id: private_call,   group: evening, day_types: [home_office, office], per_week: 2, within: ["19:00", "21:30"],
     device: phone, activity: video_call, platform: jitsi, duration: 15m-45m}
  - {id: weekend_stream, group: evening, day_types: [weekend], within: ["20:00", sleep], device: laptop,
     activity: video_stream, duration: 90m-150m, mix: {streaming: 1}}
  # bedtime
  - {id: bedtime_check,  day_types: all, at: sleep - 15m, device: phone, activity: phone_check, duration: 5m-15m,
     mix: {social_passive: .6, messaging: .4}}
