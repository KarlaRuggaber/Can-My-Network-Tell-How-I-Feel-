# Machine-readable §9 of profiles/tier2-clinical/insomnia-moderate.md (format: scheduler/README.md §2).
# A patch on 9to5-worker.yaml; the same file is the baseline for --baseline-days.
profile: insomnia-moderate
source: profiles/tier2-clinical/insomnia-moderate.md
tier: 2
extends: 9to5-worker

night_sets:                      # nights of day d (d 22:00 -> d+1 06:00), drawn per calendar week
  symptomatic: {per_week: 'N(4, 1)', clip: [3, 5]}

patch:
  anchors:                       # shifts on top of the baseline value (several matching shifts add up)
    sleep:
      - {nights: symptomatic, shift: 'U(60m, 120m)'}          # later sleep onset
    wake:
      - {day_types: [weekend], shift: 'U(60m, 120m)'}         # catch-up sleep, every weekend
  # bedtime_check needs no change: `at: sleep - 15m` follows the shifted anchor
  add:
    - {id: presleep_extension, nights: symptomatic, from: baseline_sleep, to: sleep, device: phone,
       activity: social_passive, mix: {social_passive: .4, streaming: .3, news: .15, search: .15}}
       # fill block: continuous use between the baseline and the shifted sleep time, around the bedtime check
    - {id: night_bursts, nights: symptomatic, night: true, count: 'Poisson(2.5)', clip: [2, 4],
       within: ["01:00", "04:00"], min_gap: 30m, not_before: sleep + 30m, device: phone, activity: phone_check,
       duration: {p: [.8, .2], values: ['U(2m, 5m)', 'U(5m, 8m)']},
       mix: {social_passive: .5, news: .3, messaging: .2}, pages: 1-3}
  forbid:
    - {within: ["04:00", "05:30"], night: true}   # no early-morning-waking burst (keeps the profile distinct from MDD)

# daytime_fatigue (scale day_checks / weekend_checks by 0.9, 14:00-17:00): off by default in the profile, not scripted.
