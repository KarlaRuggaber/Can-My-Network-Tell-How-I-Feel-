# GENERATED by scripts/gen_compose.py from config/devices.csv. Do not edit by hand:
# change devices.csv and run `python3 scripts/gen_compose.py`.
#
# Every service is one simulated device with a fixed IP and MAC on the external Docker
# network `sim` (Linux bridge br-sim, 10.42.1.0/24, gateway 10.42.1.1). Create it once:
#   docker network create -o com.docker.network.bridge.name=br-sim \
#     --subnet 10.42.1.0/24 --gateway 10.42.1.1 sim
name: traffic-runner

services:
  student_a_phone:
    image: traffic-runner:0.1.0
    build:
      context: .
      network: host
    container_name: student_a_phone
    hostname: student-a-phone
    init: true
    command: ["sleep", "infinity"]
    restart: unless-stopped
    environment:
      RUNNER_DEVICE: student_a_phone
      RUNNER_STRICT_IP: "1"
      TZ: Europe/Zurich
    # Peer VM address and token (calls, gaming): root-only file on the gateway, not in git.
    env_file:
      - path: peer.env
        required: false
    dns: [10.42.1.1]
    volumes:
      - ./logs:/logs
      - ./config/resolv.conf:/etc/resolv.conf:ro
      # login sessions of the test accounts (root-only, not in git)
      - ./sessions:/app/sessions:ro
    shm_size: 1gb
    mem_limit: 2g
    cpus: "2.0"
    networks:
      sim:
        ipv4_address: 10.42.1.11
        mac_address: "02:00:0a:2a:01:0b"

