# Test accounts of the project (no secrets here). The login sessions are files on the gateway:
# traffic-runner/sessions/<device>.<platform>.json (root-only, not in git), captured once by
# hand with scripts/capture_session.py. Accounts: email cmnthif+<tag>@… (one mailbox).
slack:
  start_url: "https://slack.com/signin"
  bot_name: "CMNTHIF Partner"   # the reply bot (peer-vm/slackbot)
discord:                        # social_post (since 25.10, replaces Reddit): private server CMNTHIF
  server: "CMNTHIF"
  channel: "uploads"
  # Non-secret IDs of the ONLY channel and webhook social_post may post to. Empty = not set up
  # yet (social_post logs not_implemented). The webhook URL itself (it contains the token) is
  # the file sessions/discord.webhook on the gateway, root-only, not in git.
  webhook_id: ""
  channel_id: ""
# dataset -> Slack member (display name) and email tag of the persona. social_post uses one
# webhook for all personas.
personas:
  gw_student_a: {name: Student, tag: student}
  gw_insomnia_a: {name: Ben, tag: ben.insomnia}
  gw_mdd_suicidality_a: {name: Maria, tag: maria.mdd}
  gw_social_anxiety_a: {name: Carl, tag: carl.socialanxiety}
