# Domain sets (`mix` categories) from profiles/activity-catalog.md §3.
# The catalog is the source of truth: change a domain there first, then here.
#
# Per site:
#   host     domain as written in the catalog (documentation; the log records the real host)
#   url      start URL; `{query}` is replaced by one of `queries`, chosen with the run's RNG
#   login    true = needs an account. Skipped in the MVP (no test accounts yet).
#   kind     page (default) | video. video_stream only picks `video` sites.
#   playable false = page loads, but video_stream must not pick it (no player driver for it).
#
# Notes (also in catalog §3):
#   - notion.so redirects to notion.com, office.com to m365.cloud.microsoft (checked 23.10.2026).
#     Neither is in a thesis list, so work/study use list domains that load without login.
#   - play.srf.ch redirects to www.srf.ch/play/tv (srf.ch = STREAMING). Its videos stream
#     from *.akamaized.net, which is in no thesis list.

categories:
  messaging:
    thesis_list: SOCIAL
    sites:
      - {host: web.whatsapp.com, url: "https://web.whatsapp.com/", login: true}
      - {host: web.telegram.org, url: "https://web.telegram.org/", login: true}
      - {host: discord.com, url: "https://discord.com/app", login: true}

  social_passive:
    thesis_list: SOCIAL
    sites:
      - {host: reddit.com, url: "https://www.reddit.com/"}
      - {host: tiktok.com, url: "https://www.tiktok.com/explore"}
      - {host: instagram.com, url: "https://www.instagram.com/", login: true}   # "partly" in the catalog: login wall after a few posts

  social_post:
    thesis_list: SOCIAL
    sites:
      - {host: instagram.com, url: "https://www.instagram.com/", login: true}
      - {host: discord.com, url: "https://discord.com/", login: true}   # runner: webhook of the private server (since 25.10)

  streaming:
    thesis_list: STREAMING
    sites:
      # playable false since 25.10: YouTube aborts playback after ~40 s in the automated containers
      # ("Ein Fehler ist aufgetreten", player state -1), so video_stream uses SRF only (README §6).
      - {host: youtube.com, url: "https://www.youtube.com/", kind: video, playable: false}
      - {host: play.srf.ch, url: "https://play.srf.ch/", kind: video}
      - {host: open.spotify.com, url: "https://open.spotify.com/", login: true}
      - {host: netflix.com, url: "https://www.netflix.com/", login: true}

  news:
    thesis_list: none
    sites:
      - {host: 20min.ch, url: "https://www.20min.ch/"}
      - {host: nzz.ch, url: "https://www.nzz.ch/"}
      - {host: watson.ch, url: "https://www.watson.ch/"}
      - {host: tagesanzeiger.ch, url: "https://www.tagesanzeiger.ch/"}

  work:
    thesis_list: PRODUCTIVITY
    sites:
      - {host: github.com, url: "https://github.com/"}
      - {host: gitlab.com, url: "https://gitlab.com/"}          # -> about.gitlab.com
      - {host: trello.com, url: "https://trello.com/"}
      - {host: asana.com, url: "https://asana.com/"}
      - {host: todoist.com, url: "https://www.todoist.com/"}
      - {host: outlook.office.com, url: "https://outlook.office.com/mail/", login: true}
      - {host: docs.google.com, url: "https://docs.google.com/", login: true}

  study:
    thesis_list: PRODUCTIVITY (google.com / microsoft.com only)
    sites:
      # University LMS (e.g. Canvas): URL not decided yet, needs a login anyway.
      - {host: unisg.ch, url: "https://www.unisg.ch/"}
      - {host: microsoft.com, url: "https://www.microsoft.com/de-ch/microsoft-365"}
      - {host: docs.google.com, url: "https://docs.google.com/", login: true}
      - {host: scholar.google.com, url: "https://scholar.google.com/scholar?q={query}",
         queries: [depression network traffic, sleep quality students, smartphone sensing mental health]}

  search:
    thesis_list: none
    sites:
      - {host: duckduckgo.com, url: "https://duckduckgo.com/?q={query}",
         queries: [wetter zürich, sbb fahrplan, rezept pasta, öffnungszeiten migros, kino programm]}

  shopping:
    thesis_list: none
    sites:
      - {host: galaxus.ch, url: "https://www.galaxus.ch/"}
      - {host: digitec.ch, url: "https://www.digitec.ch/"}
      - {host: zalando.ch, url: "https://www.zalando.ch/"}
      - {host: migros.ch, url: "https://www.migros.ch/"}

  gaming:
    thesis_list: SOCIAL (discord.com only)
    sites:
      - {host: steampowered.com, url: "https://store.steampowered.com/"}
      - {host: riotgames.com, url: "https://www.riotgames.com/"}
      - {host: discord.com, url: "https://discord.com/app", login: true}

  crisis_help:
    thesis_list: CRISIS / MENTAL_HEALTH
    sites:
      - {host: 143.ch, url: "https://www.143.ch/"}
      - {host: 147.ch, url: "https://www.147.ch/"}
      - {host: depression.ch, url: "https://www.depression.ch/"}

# video_stream on YouTube: open a search results page, play one of the first `result_pool`
# results (chosen with the run's RNG). On SRF: play one of the first `result_pool`
# on-demand videos of `srf_start_url`. No video IDs are hard-coded, so nothing goes stale.
video:
  srf_start_url: "https://www.srf.ch/play/tv"
  youtube_search_terms:
    - dokumentation natur
    - schweiz reise
    - kochen rezept
    - fussball highlights
    - lofi music
    - podcast deutsch
  result_pool: 5

# study_block PDF downloads (catalog §2: 1-5 MB), chosen with the run's RNG. The runner
# opens `page` and fetches `pdf` from it (same origin), so the browser downloads the file.
# arxiv.org is in no thesis list.
documents:
  pdfs:
    - {page: "https://arxiv.org/abs/1811.10154", pdf: "https://arxiv.org/pdf/1811.10154"}  # Rudin 2019, 1.4 MB
    - {page: "https://arxiv.org/abs/1706.03762", pdf: "https://arxiv.org/pdf/1706.03762"}  # 2.2 MB
    - {page: "https://arxiv.org/abs/2511.12772", pdf: "https://arxiv.org/pdf/2511.12772"}  # CareNet (Nef & Rodrigues), 5.4 MB

# music_background (catalog §3 `audio`), chosen with the run's RNG:
#   kind: page    SRF radio live page: the page load counts as srf.ch (STREAMING); the
#                 stream comes from *.akamaized.net (no thesis list); lowest quality level
#   kind: stream  direct stream URL in an empty page, e.g. the SRG MP3 stream
#                 (stream.srg-ssr.ch -> srg-ssr.ch, no thesis list)
audio:
  streams:
    - {id: srf1, kind: page, host: srf.ch, url: "https://www.srf.ch/audio/radio-srf-1-live-hoeren"}
    - {id: srf3, kind: page, host: srf.ch, url: "https://www.srf.ch/audio/radio-srf-3-live-hoeren"}
    - {id: virus, kind: page, host: srf.ch, url: "https://www.srf.ch/audio/radio-srf-virus-live-hoeren"}
  # fallback, not in any thesis list:
  # - {id: srf3_mp3, kind: stream, host: stream.srg-ssr.ch, url: "https://stream.srg-ssr.ch/srgssr/srf3/mp3/128"}

# Cookie banners: the runner clicks the first visible button whose accessible name matches
# one of `reject_buttons` (case-insensitive, whole name). If the banner has no reject button
# on its first level, it opens one of `settings_buttons` and looks for a reject button there.
# Never accepts. Keep `settings_buttons` specific: a generic "Einstellungen" also matches
# normal site menus.
consent:
  settings_buttons:
    - Individuell verwalten
    - Zwecke anzeigen
    - Cookie-Einstellungen anpassen
    - Cookie-Einstellungen
    - Dateneinstellungen
    - Manage options
  reject_buttons:
    - Reject all
    - Alle ablehnen
    - Ablehnen
    - Nur notwendige
    - Nur notwendige Cookies
    - Nur erforderliche Cookies
    - Nur erforderliche
    - Optionale Cookies ablehnen
    - Decline optional cookies
    - Reject optional cookies
    - Only allow essential cookies
    - Tout refuser
    - Alle optionalen ablehnen
    - Alle optionalen Cookies ablehnen
    - Auswahl ablehnen
    - Alle Anbieter ablehnen
    - Verwendung von Cookies und anderen Daten zu den beschriebenen Zwecken ablehnen   # YouTube "Alle ablehnen"
