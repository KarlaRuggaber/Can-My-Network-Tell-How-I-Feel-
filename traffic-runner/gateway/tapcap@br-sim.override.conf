# /etc/systemd/system/tapcap@br-sim.service.d/override.conf
# br-sim is created by Docker, so start after it and never give up restarting
# (the default start limit would mark the unit failed while the bridge is missing).
[Unit]
After=docker.service
Wants=docker.service
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/local/bin/tapcap --iface %i --out-dir /var/lib/tapcap/sim --rotate-secs 60 --rotate-mb 512 --buffer-mb 256
RestartSec=5
