# Install as /etc/systemd/system/tapfeed@.service.d/tmp-on-disk.conf (all tapfeed instances).
# dumpcap writes tshark's temporary capture file to /tmp and ignores TMPDIR (file capabilities). /tmp is a
# tmpfs, i.e. RAM, so each instance gets a disk-backed /tmp of its own: /var/lib/tapfeed/<instance>,
# created by systemd (StateDirectory) before the bind mount is set up. (An ExecStartPre that creates the
# folder does not work: the bind mount is set up before it runs, and the unit fails with 226/NAMESPACE.)
[Service]
StateDirectory=tapfeed/%i
StateDirectoryMode=0700
BindPaths=/var/lib/tapfeed/%i:/tmp
# tshark's own memory grows with the traffic it dissects (~400 MB per 30 min on br-sim at peak load);
# a restart every 10 min keeps it near 140 MB. Each restart is a gap of well under a second (decided 23.10).
Environment=TAPFEED_ROTATE=600
