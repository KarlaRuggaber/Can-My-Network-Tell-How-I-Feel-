# Install as /etc/systemd/system/tapfeed@.service.d/tmp-on-disk.conf (all tapfeed instances).
# dumpcap writes tshark's temporary capture file to /tmp and ignores TMPDIR (file capabilities). /tmp is a
# tmpfs, i.e. RAM, so the service gets a disk-backed /tmp of its own. Leftover files of a killed tshark are
# removed before each start.
[Service]
ExecStartPre=+/usr/bin/install -d -m 700 -o tapmeta -g tapmeta /var/tmp/tapfeed-%i
ExecStartPre=+/bin/sh -c 'rm -f /var/tmp/tapfeed-%i/wireshark_*'
BindPaths=/var/tmp/tapfeed-%i:/tmp
