# Appended to /etc/tmpfiles.d/tapcap.conf: separate capture folder for tapcap@br-sim.
# No age field: recordings of the snippet library are never cleaned up automatically.
d /var/lib/tapcap/sim        0750 tapcap tapcap -
d /var/lib/tapcap/sim/tmp    0750 tapcap tapcap -
d /var/lib/tapcap/sim/ready  0750 tapcap tapcap -
