#!/usr/sbin/nft -f
# B2 tap-gateway firewall + NAT. Loaded at boot by the nftables.service.
#   WAN = wlp2s0 (WiFi uplink, untrusted)   LAN = eno1 (clients via U7 Lite)
#   SIM = br-sim (Docker bridge of the traffic-runner containers, 10.42.1.0/24)
#   PEER = br-peer (call/game counterpart of the runner, peer-vm gateway mode, 10.43.0.0/24)
# PROPOSAL (traffic-runner): only the lines marked "SIM" are new. Simulated devices get
# DNS + ping on the gateway and internet, nothing else: no SSH/UniFi/DHCP, and no
# forwarding between br-sim and eno1 (they never reach the real devices).
flush ruleset

define WAN = wlp2s0
define LAN = eno1
define SIM = "br-sim"
define PEER = "br-peer"

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # --- LAN side (clients + the AP on 10.42.0.0/24) ---
        iifname $LAN udp dport { 53, 67 } accept          # DNS + DHCP
        iifname $LAN tcp dport 53 accept                  # DNS over TCP
        iifname $LAN icmp type echo-request accept        # ping the gateway
        iifname $LAN tcp dport 22 accept                  # SSH from LAN
        # UniFi controller <-> U7 Lite (adoption + management)
        iifname $LAN tcp dport { 8080, 8443, 8880, 8843, 11443 } accept
        iifname $LAN udp dport { 3478, 10001 } accept     # STUN + device discovery

        # --- SIM side (traffic-runner containers on 10.42.1.0/24) ---
        iifname $SIM udp dport 53 accept                  # SIM: DNS
        iifname $SIM tcp dport 53 accept                  # SIM: DNS over TCP
        iifname $SIM icmp type echo-request accept        # SIM: ping the gateway

        # --- WAN side (hotspot uplink) ---
        # Management over the uplink while you set things up. Comment this
        # line out once you only ever administer the box from the LAN side.
        iifname $WAN tcp dport 22 accept                  # SSH from uplink
        iifname $WAN icmp type echo-request accept        # ping from uplink

        # --- Tailscale (remote access from outside the hotspot, Deployment.md §8) ---
        # tailscaled runs with --netfilter-mode=off, so this file stays the only firewall. Only SSH is
        # reachable over the tailnet; the app is reached through an SSH tunnel as before.
        iifname "tailscale0" tcp dport 22 accept          # SSH over Tailscale
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname $LAN oifname $WAN accept                  # clients -> internet
        iifname $SIM oifname $WAN accept                  # SIM: simulated devices -> internet
        # PEER: runner -> peer stack only: Caddy (web, call API, game) and videobridge (media).
        # The peer stack itself gets no forward rule: no internet, no access to eno1.
        iifname $SIM oifname $PEER ip daddr 10.43.0.10 tcp dport 443 accept
        iifname $SIM oifname $PEER ip daddr 10.43.0.13 udp dport 10000 accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table inet nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        oifname $WAN masquerade                           # NAT clients out the uplink (covers 10.42.1.0/24 too)
    }
}
