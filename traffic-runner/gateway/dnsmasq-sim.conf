# /etc/dnsmasq.d/sim.conf - DNS for the traffic-runner containers on br-sim.
# br-sim only exists once Docker created the `sim` network, so tapgw.conf must use
# bind-dynamic instead of bind-interfaces (dnsmasq then picks the bridge up when it appears).
# The dhcp-range in tapgw.conf only covers 10.42.0.0/24; no-dhcp-interface makes it explicit.
interface=br-sim
no-dhcp-interface=br-sim
