# /etc/systemd/system/tapfeed@br-sim.service.d/override.conf
# DNS events come from the dnsmasq journal, which tapfeed@eno1 already follows for ALL
# clients (incl. 10.42.1.x). This instance only adds SNI/QUIC SNI seen on br-sim.
[Unit]
After=docker.service
Wants=docker.service
StartLimitIntervalSec=0

[Service]
Environment=TAPFEED_DNS=0
RestartSec=5
